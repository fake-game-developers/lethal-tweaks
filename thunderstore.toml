[config]
schemaVersion = "0.1.0"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "FakeGameDevelopers"
name = "LethalTweaks"
description = "Configurable Lethal Company tweaks. Continuation of MikesTweaks by MikeMediaStudios (MikeS-MS)."
websiteUrl = "https://github.com/fake-game-developers/MikesTweaks"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "artifacts/thunderstore/"

[[build.copy]]
source = "artifacts/bin/LethalTweaks/release/LethalTweaks.dll"
target = "plugins/"

[[build.copy]]
source = "CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company" ]

# Fallback for a first publish. CI replaces this with the live package categories.
[publish.categories]
lethal-company = [ "mods", "clientside", "tweaks-and-quality-of-life", "bepinex" ]
